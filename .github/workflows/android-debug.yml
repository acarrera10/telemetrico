name: Build Telemétrico v0.3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source
        run: |
          mkdir -p src
          unzip -q telemetrico-v0.3-github.zip -d src
      - name: Build debug APK
        working-directory: src
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telemetrico-v0.3-debug
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
