name: Import verified waiting soundtrack

on:
  push:
    branches: [ v0.4-development ]

permissions:
  contents: write

jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-soundtrack]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout canonical v0.4 branch
        uses: actions/checkout@v4
        with:
          ref: v0.4-development

      - name: Download verified loop-safe soundtrack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1IKK0XngK4KFw5W2Ok0h6LTzG2OJfEr2T&export=download&confirm=t' \
            -o app/src/main/res/raw/waiting_soundtrack.ogg

          SIZE=$(stat -c%s app/src/main/res/raw/waiting_soundtrack.ogg)
          echo "Downloaded bytes: $SIZE"
          if [ "$SIZE" -lt 500000 ]; then
            echo "Soundtrack download is unexpectedly small. Refusing to commit."
            exit 1
          fi

          MAGIC=$(head -c 4 app/src/main/res/raw/waiting_soundtrack.ogg)
          if [ "$MAGIC" != 'OggS' ]; then
            echo "Downloaded file is not an OGG stream. Refusing to commit."
            exit 1
          fi

      - name: Commit verified soundtrack into repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/raw/waiting_soundtrack.ogg
          git commit -m 'Integrate verified loop-safe waiting soundtrack'
          git push origin HEAD:v0.4-development
